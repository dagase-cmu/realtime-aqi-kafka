# docker/docker-compose.yml
version: '3.8'

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=file:///mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root file:///mlflow/artifacts --host 0.0.0.0 --port 5000

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: air-quality-api
    ports:
      - "8080:8080"
    volumes:
      - ../models:/app/models
      - ../data:/app/data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  monitoring:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: air-quality-monitoring
    ports:
      - "8050:8050"
    volumes:
      - ../data:/app/data
    environment:
      - MONITORING_DATA_PATH=/app/data/processed/processed_air_quality_data.csv
    command: python src/monitoring/evidently_dashboard.py

volumes:
  mlflow_data: