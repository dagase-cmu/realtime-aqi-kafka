# docker/docker-compose.yml
version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo srvr | nc zookeeper 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-topics --bootstrap-server kafka:29092 --list
      interval: 30s
      timeout: 10s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=file:///mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root file:///mlflow/artifacts --host 0.0.0.0 --port 5000

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: air-quality-producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    command: python src/kafka/producer.py

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: air-quality-consumer
    depends_on:
      kafka:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: python src/kafka/consumer.py

  monitoring:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: air-quality-monitoring
    ports:
      - "8050:8050"
    volumes:
      - ../data:/app/data
    environment:
      - MONITORING_DATA_PATH=/app/data/processed/processed_air_quality_data.csv
    command: python src/monitoring/evidently_dashboard.py

volumes:
  mlflow_data: